name: Rust checks
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
      - run: python3 examples/check_timeline_contract.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --features native-audio --all-targets -- -D warnings
      - if: runner.os == 'macOS'
        run: cargo test --locked --features native-audio
      - run: cargo build --locked
      - run: python3 -m unittest gui.test_server gui.test_musical_workflow gui.test_audio_projects gui.test_mixer_workflow gui.test_processing_workflow gui.test_finishing_workflow gui.test_pd_instrument_workflow gui.test_note_preview gui.test_note_input_workflow gui.test_note_recording_workflow gui.test_studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test gui/test_*.cjs
