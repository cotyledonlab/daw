name: Rust checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 examples/check_timeline_contract.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --features native-audio --all-targets -- -D warnings
      - if: runner.os == 'macOS'
        run: cargo test --locked --features native-audio
      - run: cargo build --locked
      - run: python3 -m unittest gui.test_server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test gui/test_live.cjs
