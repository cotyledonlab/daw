[package]
name = "daw"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A headless, scriptable DAW scaffold"
publish = false

[features]
default = []
native-audio = ["dep:cpal"]

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "=0.15.3", optional = true }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"

[dev-dependencies]
tempfile = "3.23"
